# What this repo adds to the AI reviewer's configuration.
#
# Read at install time by the agent-code-review-setup installer, which joins these onto
# the fleet-wide baseline and renders the result into .github/workflows/code-review.yml.
# Do not edit that workflow directly — it is generated, and reconverged on every install.

# The laws ARE the markdown here. A code reviewer has nothing useful to say about a law's
# prose, and every review it runs costs real money, so markdown is withheld from review in
# this repo specifically — not fleet-wide, where a README beside code is worth reading.
#
# This is an EXCLUDE and deliberately not a trigger-level paths-ignore. Filtering at the
# trigger creates no workflow run at all, and /address-pr-reviews polls the head SHA for
# one: with no run it cannot tell "nothing to review" from "the workflow is uninstalled",
# so it waits out its full 300s registration timeout and then reports a false error. An
# exclude still registers and completes a run, leaving the job's conclusion as the one
# honest answer to "was this reviewed".
#
# Code in this repo — memento's Python, the shell scripts — is reviewed normally. Markdown
# changed alongside code is named to the reviewer as withheld, so its absence reads as a
# display setting rather than as evidence the file did not change.
EXCLUDE_PATTERNS_EXTRA=*.md
