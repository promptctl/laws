# What this repo adds to the AI reviewer's configuration.
#
# Read at install time by the agent-code-review-setup installer, which joins these onto
# the fleet-wide baseline and renders the result into .github/workflows/code-review.yml.
# Do not edit that workflow directly — it is generated, and reconverged on every install.

# The law and design-doc trees are the product here, not documentation of it: a code
# reviewer has nothing useful to say about a law's prose, and every review it runs costs
# real money. So those trees are withheld in this repo specifically — not fleet-wide,
# where a README beside code is worth reading.
#
# The exclusion is SCOPED to the prose trees rather than to `*.md`, because most markdown
# in this repo is the ordinary docs-beside-code case and stays reviewable:
# PROVIDER_CONTRACT.md states the contract action_provider.py must satisfy, and drift
# between them is exactly what a reviewer should catch. Blanket `*.md` would have thrown
# that away along with README, CHANGELOG, SEAMS.md, and memento's skill guidance.
#
# The trees named below contain markdown and nothing else, so no code is hidden by them.
#
# These are EXCLUDES and deliberately not a trigger-level paths-ignore. Filtering at the
# trigger creates no workflow run at all, and /address-pr-reviews polls the head SHA for
# one: with no run it cannot tell "nothing to review" from "the workflow is uninstalled",
# so it waits out its registration timeout and then reports a false error. An exclude
# still registers and completes a run, leaving the job's conclusion as the one honest
# answer to "was this reviewed".
#
# Markdown changed alongside code is named to the reviewer as withheld, so its absence
# reads as a display setting rather than as evidence the file did not change.
EXCLUDE_PATTERNS_EXTRA=plugins/laws/skills/**,plugins/laws/design-docs/**,design-docs/**
