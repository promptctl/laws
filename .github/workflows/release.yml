name: release

# One process for every promptctl plugin repo. The implementation lives in
# promptctl/.github, with the procedure in its RELEASING.md. This file only
# says when it runs. [LAW:one-source-of-truth]

on:
  push:
    tags: ['*--v*']

permissions:
  contents: write

jobs:
  release:
    uses: promptctl/.github/.github/workflows/release-plugin.yml@master
